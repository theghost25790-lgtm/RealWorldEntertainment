name: Archive Registry Validation

on:
  pull_request:
    paths:
      - "website/v32.3/master-record-registry.json"
      - "website/v32.3/validate-registry.mjs"
      - ".github/workflows/archive-registry-validation.yml"
  push:
    branches: [main]
    paths:
      - "website/v32.3/master-record-registry.json"
      - "website/v32.3/validate-registry.mjs"
      - ".github/workflows/archive-registry-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Validate canonical archive registry
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate registry
        run: node website/v32.3/validate-registry.mjs
